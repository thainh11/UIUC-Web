[project]
name = "uiuc-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "psycopg[binary,pool]",
  "pgvector",
  "numpy",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["ingestion", "backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["FLY002"]  # ruff 0.17 enables it by default; a joined list reads better for the OpenAlex select fields

[tool.ruff.lint.isort]
from-first = true
combine-as-imports = true
